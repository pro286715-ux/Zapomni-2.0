name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android project
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Запомни" com.zapomni.app --web-dir www
          npx cap add android
          cat > android/app/src/main/java/com/zapomni/app/MainActivity.java <<'EOF'
          package com.zapomni.app;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              registerPlugin(ZapomniPlugin.class);
              super.onCreate(b);
              if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
            }
          }
          EOF
          cat > android/app/src/main/java/com/zapomni/app/AdminReceiver.java <<'EOF'
          package com.zapomni.app;
          import android.app.admin.DeviceAdminReceiver;
          public class AdminReceiver extends DeviceAdminReceiver {}
          EOF
          cat > android/app/src/main/java/com/zapomni/app/ZapomniPlugin.java <<'EOF'
          package com.zapomni.app;
          import android.app.AlarmManager;
          import android.appwidget.AppWidgetManager;
          import android.app.NotificationManager;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Zapomni")
          public class ZapomniPlugin extends Plugin {
            @PluginMethod
            public void schedule(PluginCall call) {
              Scheduler.save(getContext(), call.getString("items", "[]"), Boolean.TRUE.equals(call.getBoolean("notify", true)));
              Scheduler.scheduleAll(getContext());
            ZapomniWidget.updateAll(getContext());
              call.resolve();
            }
            @PluginMethod
            public void status(PluginCall call) {
              Context c = getContext();
              JSObject r = new JSObject();
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              DevicePolicyManager dp = (DevicePolicyManager) c.getSystemService(Context.DEVICE_POLICY_SERVICE);
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              r.put("dnd", nm.isNotificationPolicyAccessGranted());
              r.put("admin", dp.isAdminActive(new ComponentName(c, AdminReceiver.class)));
              r.put("overlay", Settings.canDrawOverlays(c));
              r.put("alarm", Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms());
              call.resolve(r);
            }
            @PluginMethod
            public void saveImage(PluginCall call) {
              try {
                byte[] b = android.util.Base64.decode(call.getString("data"), android.util.Base64.DEFAULT);
                android.content.ContentValues v = new android.content.ContentValues();
                v.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, call.getString("name", "zapomni.png"));
                v.put(android.provider.MediaStore.Images.Media.MIME_TYPE, "image/png");
                if (Build.VERSION.SDK_INT >= 29) v.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Zapomni");
                Uri u = getContext().getContentResolver().insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                java.io.OutputStream o = getContext().getContentResolver().openOutputStream(u);
                o.write(b);
                o.close();
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
            @PluginMethod
            public void pinWidget(PluginCall call) {
              Context c = getContext();
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              JSObject r = new JSObject();
              boolean ok = Build.VERSION.SDK_INT >= 26 && m.isRequestPinAppWidgetSupported();
              if (ok) m.requestPinAppWidget(new ComponentName(c, ZapomniWidget.class), null, null);
              r.put("ok", ok);
              call.resolve(r);
            }
            @PluginMethod
            public void openSettings(PluginCall call) {
              Context c = getContext();
              String k = call.getString("kind", "");
              String pkg = "package:" + c.getPackageName();
              Intent i;
              if (k.equals("dnd")) i = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
              else if (k.equals("admin")) {
                i = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, new ComponentName(c, AdminReceiver.class));
              }
              else if (k.equals("overlay")) i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse(pkg));
              else if (k.equals("alarm") && Build.VERSION.SDK_INT >= 31) i = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse(pkg));
              else i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse(pkg));
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              c.startActivity(i);
              call.resolve();
            }
          }
          EOF
          cat > android/app/src/main/java/com/zapomni/app/Scheduler.java <<'EOF'
          package com.zapomni.app;
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.admin.DevicePolicyManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Scheduler extends BroadcastReceiver {
            static final String P = "zp";

            static void save(Context c, String items, boolean notify) {
              c.getSharedPreferences(P, 0).edit().putString("items", items).putBoolean("notify", notify).apply();
            }

            static PendingIntent pi(Context c, int code, String id, int ph) {
              Intent i = new Intent(c, Scheduler.class).putExtra("id", id).putExtra("ph", ph);
              return PendingIntent.getBroadcast(c, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }

            static boolean has(JSONArray d, int v) throws Exception {
              for (int i = 0; i < d.length(); i++) if (d.getInt(i) == v) return true;
              return false;
            }

            static long next(JSONObject o, int ph) throws Exception {
              String[] hm = o.getString(ph == 0 ? "from" : "to").split(":");
              JSONArray d = o.getJSONArray("days");
              Calendar now = Calendar.getInstance();
              for (int add = 0; add <= 8; add++) {
                Calendar t = (Calendar) now.clone();
                t.add(Calendar.DAY_OF_YEAR, add);
                t.set(Calendar.HOUR_OF_DAY, Integer.parseInt(hm[0]));
                t.set(Calendar.MINUTE, Integer.parseInt(hm[1]));
                t.set(Calendar.SECOND, 0);
                t.set(Calendar.MILLISECOND, 0);
                if (t.getTimeInMillis() <= now.getTimeInMillis() + 1000) continue;
                if (ph == 1 || has(d, t.get(Calendar.DAY_OF_WEEK))) return t.getTimeInMillis();
              }
              return now.getTimeInMillis() + 86400000L;
            }

            static void set(AlarmManager am, long t, PendingIntent p) {
              try {
                if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
                else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
              } catch (Exception e) {
                am.set(AlarmManager.RTC_WAKEUP, t, p);
              }
            }

            static void scheduleAll(Context c) {
              SharedPreferences sp = c.getSharedPreferences(P, 0);
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              for (String k : sp.getString("ids", "").split(",")) {
                if (!k.isEmpty()) am.cancel(pi(c, Integer.parseInt(k), "", 0));
              }
              StringBuilder ids = new StringBuilder();
              try {
                JSONArray a = new JSONArray(sp.getString("items", "[]"));
                for (int n = 0; n < a.length(); n++) {
                  JSONObject o = a.getJSONObject(n);
                  for (int ph = 0; ph < 2; ph++) {
                    int code = (o.getString("id") + ph).hashCode();
                    set(am, next(o, ph), pi(c, code, o.getString("id"), ph));
                    ids.append(code).append(',');
                  }
                }
              } catch (Exception e) {
              }
              sp.edit().putString("ids", ids.toString()).apply();
            }

            @Override
            public void onReceive(Context c, Intent in) {
              if (Intent.ACTION_BOOT_COMPLETED.equals(in.getAction())) {
                scheduleAll(c);
                return;
              }
              SharedPreferences sp = c.getSharedPreferences(P, 0);
              String id = in.getStringExtra("id");
              int ph = in.getIntExtra("ph", 0);
              try {
                JSONArray a = new JSONArray(sp.getString("items", "[]"));
                for (int n = 0; n < a.length(); n++) {
                  JSONObject o = a.getJSONObject(n);
                  if (o.getString("id").equals(id)) run(c, sp, o, ph);
                }
              } catch (Exception e) {
              }
              scheduleAll(c);
            }

            static void run(Context c, SharedPreferences sp, JSONObject o, int ph) throws Exception {
              String t = o.getString("type"), id = o.getString("id"), v = o.optString("value", "");
              String title = o.optString("title", "Zapomni"), text = o.optString("text", "");
              boolean on = ph == 0, nt = sp.getBoolean("notify", true);
              boolean act = sp.getBoolean("a_" + id, false);
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              AudioManager au = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
              SharedPreferences.Editor ed = sp.edit();
              try {
                if (t.equals("dnd")) {
                  if (on && nm.isNotificationPolicyAccessGranted()) {
                    nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                    ed.putBoolean("a_" + id, true);
                    if (nt) note(c, title, text, null);
                  } else if (!on && act) {
                    nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                    ed.putBoolean("a_" + id, false);
                  }
                } else if (t.equals("silent")) {
                  if (on) {
                    ed.putInt("r_" + id, au.getRingerMode()).putBoolean("a_" + id, true).apply();
                    try {
                      au.setRingerMode(AudioManager.RINGER_MODE_SILENT);
                    } catch (Exception e) {
                      au.setRingerMode(AudioManager.RINGER_MODE_VIBRATE);
                    }
                    if (nt) note(c, title, text, null);
                  } else if (act) {
                    try {
                      au.setRingerMode(sp.getInt("r_" + id, AudioManager.RINGER_MODE_NORMAL));
                    } catch (Exception e) {
                    }
                    ed.putBoolean("a_" + id, false);
                  }
                } else if (on && t.equals("link")) {
                  open(c, new Intent(Intent.ACTION_VIEW, Uri.parse(v.startsWith("http") ? v : "https://" + v)), title, text);
                } else if (on && t.equals("app")) {
                  PackageManager pm = c.getPackageManager();
                  Intent li = pm.getLaunchIntentForPackage(v);
                  if (li == null) {
                    Intent m = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                    for (ResolveInfo r : pm.queryIntentActivities(m, 0)) {
                      if (r.loadLabel(pm).toString().toLowerCase().contains(v.toLowerCase())) {
                        li = pm.getLaunchIntentForPackage(r.activityInfo.packageName);
                        break;
                      }
                    }
                  }
                  if (li != null) open(c, li, title, text);
                } else if (on && t.equals("lock")) {
                  DevicePolicyManager d = (DevicePolicyManager) c.getSystemService(Context.DEVICE_POLICY_SERVICE);
                  if (d.isAdminActive(new ComponentName(c, AdminReceiver.class))) d.lockNow();
                  if (nt) note(c, title, text, null);
                }
              } finally {
                ed.apply();
              }
            }

            static void open(Context c, Intent i, String title, String text) {
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try {
                c.startActivity(i);
              } catch (Exception e) {
              }
              note(c, title, text, PendingIntent.getActivity(c, title.hashCode(), i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
            }

            static void note(Context c, String title, String text, PendingIntent p) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              Notification.Builder b;
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel("zp", "Zapomni", NotificationManager.IMPORTANCE_HIGH));
                b = new Notification.Builder(c, "zp");
              } else b = new Notification.Builder(c);
              b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(title).setContentText(text).setAutoCancel(true);
              if (p != null) b.setContentIntent(p);
              nm.notify((title + text).hashCode(), b.build());
            }
          }
          EOF
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/values
          cat > android/app/src/main/java/com/zapomni/app/ZapomniWidget.java <<'EOF'
          package com.zapomni.app;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class ZapomniWidget extends AppWidgetProvider {
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              for (int id : ids) m.updateAppWidget(id, build(c));
            }

            static void updateAll(Context c) {
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              for (int id : m.getAppWidgetIds(new ComponentName(c, ZapomniWidget.class))) m.updateAppWidget(id, build(c));
            }

            static RemoteViews build(Context c) {
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
              SharedPreferences sp = c.getSharedPreferences(Scheduler.P, 0);
              int dow = Calendar.getInstance().get(Calendar.DAY_OF_WEEK);
              ArrayList<String> rows = new ArrayList<String>();
              try {
                JSONArray a = new JSONArray(sp.getString("items", "[]"));
                for (int n = 0; n < a.length(); n++) {
                  JSONObject o = a.getJSONObject(n);
                  if (Scheduler.has(o.getJSONArray("days"), dow)) rows.add(o.getString("from") + " - " + o.getString("to") + "   " + o.optString("title"));
                }
              } catch (Exception e) {
              }
              Collections.sort(rows);
              StringBuilder sb = new StringBuilder();
              for (String r : rows) sb.append(r).append("\n");
              v.setTextViewText(R.id.wbody, rows.isEmpty() ? c.getString(R.string.w_empty) : sb.toString().trim());
              Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
              if (li != null) v.setOnClickPendingIntent(R.id.wroot, PendingIntent.getActivity(c, 0, li, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
              return v;
            }
          }
          EOF
          cat > android/app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/wroot" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="12dp" android:background="@drawable/widget_bg">
            <TextView android:id="@+id/wtitle" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="@string/w_title" android:textColor="#25F4EE" android:textStyle="bold" android:textSize="14sp"/>
            <TextView android:id="@+id/wbody" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:textColor="#FFFFFF" android:textSize="13sp" android:maxLines="8"/>
          </LinearLayout>
          EOF
          cat > android/app/src/main/res/drawable/widget_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#000000"/><corners android:radius="16dp"/><stroke android:width="1dp" android:color="#2A2A2A"/></shape>
          EOF
          cat > android/app/src/main/res/xml/widget_info.xml <<'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="250dp" android:minHeight="110dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen" android:description="@string/w_desc"/>
          EOF
          cat > android/app/src/main/res/values/zw.xml <<'EOF'
          <resources><string name="w_title">Запомни · сегодня</string><string name="w_empty">На сегодня ничего не запланировано</string><string name="w_desc">Расписание действий на сегодня</string></resources>
          EOF
          cat > android/app/src/main/res/xml/device_admin.xml <<'EOF'
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android"><uses-policies><force-lock/></uses-policies></device-admin>
          EOF
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perms=''.join('<uses-permission android:name="android.permission.%s"/>'%x for x in ['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','ACCESS_NOTIFICATION_POLICY','SYSTEM_ALERT_WINDOW'])
          q='<queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent></queries>'
          rec='<receiver android:name=".Scheduler" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver><receiver android:name=".AdminReceiver" android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true"><meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/><intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/></intent-filter></receiver><receiver android:name=".ZapomniWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/></receiver>'
          s=s.replace('<application',perms+q+'<application',1).replace('</application>',rec+'</application>',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../zapomni.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Запомни v${{ github.run_number }}
          files: zapomni.apk
